<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1456b8">
<title>Tareas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--b:#1456b8;--bd:#0c3a82;--bl:#eaf2ff;--c:#5bb8f0;--t:#14233d;--r:#c62828;--g:#2e7d32;--o:#e08a00}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:var(--t);padding-bottom:70px}
header{background:#fff;color:var(--b);border-bottom:3px solid var(--b);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0;flex:1;text-align:right}header button{background:none;border:0;color:var(--b);font-size:22px}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--bl);border-radius:12px;padding:12px 14px;margin:0 0 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card small{color:#46608a;display:block}
.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;margin:4px 4px 4px 0}
.btn.s{background:#fff;color:var(--b);border:1.5px solid var(--b)}.btn.x{background:var(--r)}
input,select{width:100%;padding:10px;border:1.5px solid #b9cff0;border-radius:9px;font-size:16px;margin:4px 0 10px;background:#fff}
input[type=checkbox]{width:22px;height:22px;margin:0}label{font-size:13px;color:#46608a}
.row{display:flex;gap:10px}.row>*{flex:1}.chk{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:16px;color:var(--t)}
.pill{border-radius:20px;padding:3px 10px;font-size:12px;color:#fff;white-space:nowrap}
.ok{background:var(--g)}.warn{background:var(--o)}.bad{background:var(--r)}.pr{background:var(--b)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #cfe0f8;display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:12px 0;font-size:14px;color:#6f86ad}nav button.on{color:var(--b);font-weight:700;border-top:3px solid var(--b)}
#toast{position:fixed;top:70px;left:10px;right:10px;max-width:740px;margin:auto;z-index:9}
#toast div{background:var(--bd);color:#fff;padding:12px;border-radius:10px;margin-bottom:6px;box-shadow:0 3px 10px #0004}
.mw{display:flex;gap:6px;align-items:flex-start}.mw input,.mw textarea{flex:1;min-width:0}.mic{border:0;background:var(--b);color:#fff;border-radius:10px;width:44px;height:44px;font-size:20px;flex:none;margin-top:4px}.mic.on{background:var(--r);animation:pl 1s infinite}@keyframes pl{50%{opacity:.5}}
h3{color:var(--bd);margin:16px 0 6px}.tot{font-size:18px;font-weight:700;color:var(--bd)}
</style></head><body>

function exp(kind,fmt){
 let L=flat().filter(x=>(!R.cat||x.c.id==R.cat)&&(!R.a||x.t.end>=R.a)&&(!R.b||x.t.end<=R.b)&&(R.st!='p'||!x.t.done)&&(R.st!='f'||x.t.done)),rows,title;
 if(kind=='t'){title='Reporte de tareas';rows=L.map(({c,l,t})=>({Categoría:c.name,Cliente:l.name,Tarea:t.title,Inicio:t.start,Fin:t.end,'Días por vencer':t.done?'-':days(t),Estado:stat(t)}))}
 else{title='Cobrado y por cobrar';L=L.filter(x=>x.t.price);let tc=0,tp=0;rows=L.map(({c,l,t})=>{const cb=(t.adv||[]).filter(a=>(!R.a||a.d>=R.a)&&(!R.b||a.d<=R.b)).reduce((s,a)=>s+a.v,0);tc+=cb;tp+=due(t);return{Categoría:c.name,Cliente:l.name,Tarea:t.title,Total:m(t.total),Cobrado:m(cb),'Por cobrar':m(due(t)),Estado:stat(t)}});
  if(rows.length)rows.push({Categoría:'TOTAL',Cliente:'',Tarea:'',Total:'',Cobrado:m(tc),'Por cobrar':m(tp),Estado:''})}
 if(!rows.length)return alert('No hay datos con esos filtros');
 const nm=title.replace(/ /g,'_');
 if(fmt=='x'){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Reporte');saveOut(nm+'.xlsx',XLSX.write(wb,{type:'base64',bookType:'xlsx'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}
 else{const d=new jspdf.jsPDF({orientation:'landscape'});d.setTextColor(20,86,184);d.text('MCG · '+title+(R.a||R.b?` (${R.a||'…'} a ${R.b||'…'})`:''),14,14);d.autoTable({head:[Object.keys(rows[0])],body:rows.map(Object.values),startY:20,headStyles:{fillColor:[20,86,184]}});saveOut(nm+'.pdf',d.output('datauristring').split(',').pop(),'application/pdf')}
}
